<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud NVR — AI Alerts</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap');

:root {
  --bg:      #070b12;
  --surface: #0d1420;
  --panel:   #111927;
  --border:  #1e2d42;
  --accent:  #00d4ff;
  --live:    #22c55e;
  --warn:    #f59e0b;
  --red:     #ef4444;
  --text:    #e2eaf4;
  --muted:   #4a6080;
  --mono:    'JetBrains Mono', monospace;
  --display: 'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--display);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
}

.brand .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
  animation: pulse 1.5s infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes spin  { to{transform:rotate(360deg)} }

.nav-btns { display: flex; gap: 8px; }
.nav-btns a {
  padding: 7px 16px; border-radius: 6px;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  text-decoration: none; border: 1px solid var(--border);
  color: var(--muted); transition: all 0.2s;
  position: relative;
}
.nav-btns a.active, .nav-btns a:hover {
  background: var(--accent); color: #000; border-color: var(--accent);
}
.nav-btns a .nav-badge {
  display: inline-block;
  margin-left: 6px; padding: 1px 6px;
  background: var(--red); color: #fff;
  border-radius: 8px; font-size: 10px; font-weight: 700;
  vertical-align: middle;
}
.nav-btns a.active .nav-badge { background: #000; color: var(--red); }

/* ── STATUS BAR ── */
.statusbar {
  display: flex; gap: 24px; align-items: center;
  padding: 8px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 11px; color: var(--muted);
}
.statusbar span { display: flex; align-items: center; gap: 6px; }
.sb-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 6px var(--accent);
  animation: pulse 1.5s infinite;
}

/* ── STAT TILES ── */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; padding: 16px 24px 8px;
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 14px 16px;
}
.stat .label {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px;
}
.stat .value {
  font-family: var(--display); font-size: 28px; font-weight: 800;
  margin-top: 6px; line-height: 1;
}
.stat.alert .value { color: var(--red); }
.stat.warn  .value { color: var(--warn); }
.stat.ok    .value { color: var(--live); }
.stat .sub {
  font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px;
}

/* ── FILTERS ── */
.filters {
  display: flex; gap: 8px; padding: 0 24px 12px; align-items: center; flex-wrap: wrap;
}
.filters label {
  font-family: var(--mono); font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px; margin-right: 4px;
}
.filters select {
  padding: 7px 12px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 5px;
  color: var(--text); font-family: var(--mono); font-size: 11px;
  outline: none; cursor: pointer;
}
.filters select:focus { border-color: var(--accent); }
.filters .btn {
  padding: 7px 14px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text); font-family: var(--mono); font-size: 11px;
  font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.filters .btn:hover { border-color: var(--accent); color: var(--accent); }
.filters .refresh-info {
  margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
}

/* ── ALERT TABLE ── */
.alert-list {
  margin: 0 24px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.alert-row {
  display: grid;
  grid-template-columns: 160px 80px 140px 110px 1fr 90px;
  gap: 14px; align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.alert-row:last-child { border-bottom: none; }
.alert-row:hover { background: var(--panel); }
.alert-row.unread { border-left: 3px solid var(--accent); padding-left: 13px; }
.alert-row.acked  { opacity: 0.45; }

.alert-row .when {
  font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap;
}
.alert-row .cam {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--accent);
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.2);
  padding: 3px 8px; border-radius: 3px; text-align: center;
}
.alert-row .type {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase;
  padding: 4px 8px; border-radius: 3px; text-align: center;
}
.type.zone_violation, .type.zone_capacity {
  background: rgba(239,68,68,0.12); color: var(--red);
  border: 1px solid rgba(239,68,68,0.25);
}
.type.left_behind {
  background: rgba(245,158,11,0.12); color: var(--warn);
  border: 1px solid rgba(245,158,11,0.25);
}
.type.loitering {
  background: rgba(0,212,255,0.1); color: var(--accent);
  border: 1px solid rgba(0,212,255,0.25);
}
.type.out_of_room_non_break {
  background: rgba(34,197,94,0.1); color: var(--live);
  border: 1px solid rgba(34,197,94,0.25);
}

.alert-row .target {
  font-family: var(--mono); font-size: 11px; color: var(--text);
}
.alert-row .msg {
  font-family: var(--mono); font-size: 12px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.alert-row .ack-btn {
  padding: 5px 10px; border-radius: 4px;
  background: var(--panel); border: 1px solid var(--border);
  color: var(--muted); font-family: var(--mono); font-size: 10px;
  font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.alert-row .ack-btn:hover { border-color: var(--accent); color: var(--accent); }
.alert-row .ack-btn.done {
  color: var(--live); border-color: rgba(34,197,94,0.3);
  background: rgba(34,197,94,0.06);
  cursor: default;
}

.empty {
  padding: 60px 24px; text-align: center;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
}
.empty .icon { font-size: 36px; opacity: 0.3; margin-bottom: 12px; }

/* ── MODAL ── */
.modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 24px;
}
.modal.show { display: flex; }
.modal-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  max-width: 880px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  padding: 24px;
}
.modal-content .close {
  float: right; cursor: pointer; color: var(--muted);
  font-size: 24px; line-height: 1;
}
.modal-content .close:hover { color: var(--accent); }
.modal-content h3 {
  font-size: 18px; font-weight: 700; margin-bottom: 4px;
}
.modal-content .modal-sub {
  font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 16px;
}
.modal-content img {
  max-width: 100%; border-radius: 4px;
  border: 1px solid var(--border);
  display: block; margin: 16px 0;
}
.modal-content dl {
  display: grid; grid-template-columns: 130px 1fr;
  gap: 8px 16px;
  font-family: var(--mono); font-size: 12px;
  margin-top: 12px;
}
.modal-content dt {
  color: var(--muted); text-transform: uppercase;
  font-size: 10px; letter-spacing: 1px; padding-top: 2px;
}
.modal-content dd { color: var(--text); }
.modal-actions {
  display: flex; gap: 8px; margin-top: 20px;
  padding-top: 16px; border-top: 1px solid var(--border);
}
.modal-actions .btn {
  padding: 8px 16px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text); font-family: var(--mono); font-size: 11px;
  font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.modal-actions .btn.primary {
  background: var(--accent); color: #000; border-color: var(--accent);
}
.modal-actions .btn:hover { border-color: var(--accent); color: var(--accent); }
.modal-actions .btn.primary:hover { opacity: 0.85; color: #000; }
.modal-actions .btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="dot"></div>Cloud NVR</div>
  <nav class="nav-btns">
    <a href="/roll">Roll (10 min)</a>
    <a href="/24hr">24hr Playback</a>
    <a href="/live">Live</a>
    <a href="/ai" class="active">Alerts <span class="nav-badge" id="nav-badge" style="display:none">0</span></a>
  </nav>
</header>

<div class="statusbar">
  <span><div class="sb-dot"></div> AI SURVEILLANCE</span>
  <span id="sb-detector">Detector status: —</span>
  <span id="sb-time">—</span>
</div>

<!-- STAT TILES -->
<section class="stats">
  <div class="stat alert">
    <div class="label">Unacknowledged</div>
    <div class="value" id="stat-unacked">—</div>
    <div class="sub">awaiting review</div>
  </div>
  <div class="stat warn">
    <div class="label">Today</div>
    <div class="value" id="stat-today">—</div>
    <div class="sub">since midnight</div>
  </div>
  <div class="stat">
    <div class="label">Last 7 days</div>
    <div class="value" id="stat-7d">—</div>
    <div class="sub">all alerts</div>
  </div>
  <div class="stat ok">
    <div class="label">Refresh</div>
    <div class="value" id="stat-refresh" style="font-size:14px;font-weight:600;color:var(--muted);padding-top:8px;">—</div>
    <div class="sub">auto every 10s</div>
  </div>
</section>

<!-- FILTERS -->
<div class="filters">
  <label>Camera</label>
  <select id="filter-camera">
    <option value="">All</option>
    <option value="cam104">cam104</option>
    <option value="cam105">cam105</option>
    <option value="cam106">cam106</option>
  </select>

  <label>Type</label>
  <select id="filter-type">
    <option value="">All</option>
    <option value="zone_violation">Zone violation</option>
    <option value="zone_capacity">Zone capacity</option>
    <option value="left_behind">Left behind</option>
    <option value="loitering">Loitering</option>
    <option value="out_of_room_non_break">Out of room</option>
  </select>

  <label>Status</label>
  <select id="filter-acked">
    <option value="">All</option>
    <option value="0" selected>Unacknowledged</option>
    <option value="1">Acknowledged</option>
  </select>

  <button class="btn" onclick="refresh()">↻ Refresh</button>
  <span class="refresh-info" id="refresh-info">—</span>
</div>

<!-- ALERT LIST -->
<div class="alert-list" id="alerts">
  <div class="empty"><div class="icon">⏳</div>Loading alerts...</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">×</span>
    <h3 id="m-title">Alert detail</h3>
    <div class="modal-sub" id="m-subtitle">—</div>
    <img id="m-img" src="" alt="" style="display:none">
    <dl>
      <dt>When</dt>      <dd id="m-when">—</dd>
      <dt>Camera</dt>    <dd id="m-cam">—</dd>
      <dt>Type</dt>      <dd id="m-type">—</dd>
      <dt>Track ID</dt>  <dd id="m-track">—</dd>
      <dt>Class</dt>     <dd id="m-class">—</dd>
      <dt>Zone</dt>      <dd id="m-zone">—</dd>
      <dt>Message</dt>   <dd id="m-msg">—</dd>
    </dl>
    <div class="modal-actions">
      <button class="btn primary" id="m-ack">Acknowledge</button>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────
let currentAlert = null;

// ── FORMAT ────────────────────────────────────────────
function fmtTime(iso) {
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  return `${dd}-${mm}-${yy} ${hh}:${mi}:${ss}`;
}

function fmtTimeShort(iso) {
  return new Date(iso).toLocaleTimeString([], {
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function typeLabel(t) {
  return t.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// ── FETCH ─────────────────────────────────────────────
async function fetchJSON(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// ── STATS ─────────────────────────────────────────────
async function loadStats() {
  try {
    const s = await fetchJSON('/ai/stats');
    document.getElementById('stat-today').textContent = s.today;
    document.getElementById('stat-unacked').textContent = s.unacked;
    const total7 = (s.by_type_7d || []).reduce((a, r) => a + r.n, 0);
    document.getElementById('stat-7d').textContent = total7;

    const now = new Date();
    document.getElementById('stat-refresh').textContent = fmtTimeShort(now.toISOString());
    document.getElementById('sb-time').textContent = fmtTime(now.toISOString());
    document.getElementById('refresh-info').textContent =
      'Last refresh: ' + now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});

    // Update nav badge
    const badge = document.getElementById('nav-badge');
    if (s.unacked > 0) {
      badge.textContent = s.unacked;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }

    // Detector heartbeat: based on whether stats endpoint responds
    document.getElementById('sb-detector').textContent = 'Detector: online';
  } catch (e) {
    console.error('stats failed', e);
    document.getElementById('sb-detector').textContent = 'Detector: offline?';
  }
}

// ── ALERTS ────────────────────────────────────────────
async function loadAlerts() {
  const cam = document.getElementById('filter-camera').value;
  const type = document.getElementById('filter-type').value;
  const acked = document.getElementById('filter-acked').value;
  const params = new URLSearchParams();
  if (cam) params.set('camera', cam);
  if (type) params.set('type', type);
  if (acked !== '') params.set('acked', acked);
  params.set('limit', '100');

  try {
    const data = await fetchJSON('/ai/alerts?' + params);
    renderAlerts(data.alerts || []);
  } catch (e) {
    console.error('alerts failed', e);
    document.getElementById('alerts').innerHTML =
      '<div class="empty"><div class="icon">⚠</div>Failed to load alerts. Is the detector running?</div>';
  }
}

function renderAlerts(alerts) {
  const el = document.getElementById('alerts');
  if (!alerts.length) {
    el.innerHTML = '<div class="empty"><div class="icon">✓</div>No alerts match your filters.</div>';
    return;
  }
  el.innerHTML = alerts.map(a => `
    <div class="alert-row ${a.acked ? 'acked' : 'unread'}" data-id="${a.id}">
      <span class="when">${fmtTime(a.ts_iso)}</span>
      <span class="cam">${a.camera}</span>
      <span class="type ${a.alert_type}">${typeLabel(a.alert_type)}</span>
      <span class="target">${a.zone || a.class_name || '—'}</span>
      <span class="msg" title="${escapeHtml(a.message)}">${escapeHtml(a.message)}</span>
      <button class="ack-btn ${a.acked ? 'done' : ''}" data-id="${a.id}">
        ${a.acked ? '✓ Acked' : 'Ack'}
      </button>
    </div>
  `).join('');

  // Wire row clicks (open modal)
  el.querySelectorAll('.alert-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('ack-btn')) return;
      const id = parseInt(row.dataset.id);
      const alertObj = alerts.find(a => a.id === id);
      if (alertObj) openAlert(alertObj);
    });
  });

  // Wire ack buttons
  el.querySelectorAll('.ack-btn').forEach(btn => {
    if (btn.classList.contains('done')) return;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      ackAlert(parseInt(btn.dataset.id), btn);
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ── MODAL ─────────────────────────────────────────────
function openAlert(a) {
  currentAlert = a;
  document.getElementById('m-title').textContent = typeLabel(a.alert_type);
  document.getElementById('m-subtitle').textContent = `Alert #${a.id} · ${a.camera}`;
  document.getElementById('m-when').textContent = fmtTime(a.ts_iso);
  document.getElementById('m-cam').textContent = a.camera;
  document.getElementById('m-type').textContent = typeLabel(a.alert_type);
  document.getElementById('m-track').textContent = a.track_id ?? '—';
  document.getElementById('m-class').textContent = a.class_name ?? '—';
  document.getElementById('m-zone').textContent = a.zone ?? '—';
  document.getElementById('m-msg').textContent = a.message;
  const img = document.getElementById('m-img');
  if (a.snapshot) {
    img.src = '/ai/snapshot/' + a.snapshot;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
  const ackBtn = document.getElementById('m-ack');
  ackBtn.textContent = a.acked ? '✓ Acknowledged' : 'Acknowledge';
  ackBtn.disabled = !!a.acked;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('m-ack').addEventListener('click', () => {
  if (currentAlert && !currentAlert.acked) ackAlert(currentAlert.id);
});

async function ackAlert(id, btn) {
  try {
    await fetchJSON('/ai/alert/' + id + '/ack', { method: 'POST' });
    if (btn) {
      btn.textContent = '✓ Acked';
      btn.classList.add('done');
    }
    if (currentAlert && currentAlert.id === id) {
      currentAlert.acked = 1;
      document.getElementById('m-ack').textContent = '✓ Acknowledged';
      document.getElementById('m-ack').disabled = true;
    }
    loadStats();
  } catch (e) {
    console.error('ack failed', e);
  }
}

// ── REFRESH ──────────────────────────────────────────
function refresh() {
  loadStats();
  loadAlerts();
}

['filter-camera', 'filter-type', 'filter-acked'].forEach(id =>
  document.getElementById(id).addEventListener('change', loadAlerts)
);

// Keyboard: Esc closes modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ── INIT ─────────────────────────────────────────────
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
