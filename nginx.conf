load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    gzip on;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    server {
        listen 8080;
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/www/recordings;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        idle_streams off;
        ping 30s;
        ping_timeout 10s;

        # ──────────────────────────────────────
        # ROLL — 10 minute clips
        # ──────────────────────────────────────
        application live {
            live on;
            drop_idle_publisher 10s;
            record all;
            record_path /var/www/recordings/roll;
            record_interval 600;
            record_unique on;
            record_suffix .flv;

            exec_record_done ffmpeg -y -i $path
                -c:v copy -an
                -movflags +faststart
                /var/www/recordings/roll/$basename.mp4;
        }

        # ──────────────────────────────────────
        # 24HR — one file per 24 hours
        # ──────────────────────────────────────
        application live24 {
            live on;
            drop_idle_publisher 10s;
            record all;
            record_path /var/www/recordings/24hr;
            record_interval 3600;
            record_unique on;
            record_suffix .flv;
            exec_record_done ffmpeg -y
                -fflags +genpts+igndts
                -err_detect ignore_err
                -i $path
                -c:v copy -an
                -movflags +faststart
                /var/www/recordings/24hr/$basename.mp4;
}

        # ──────────────────────────────────────
        # LIVESTREAM — HLS live view
        # ──────────────────────────────────────
        application livestream {
            live on;
            drop_idle_publisher 10s;
            hls on;
            hls_path /var/www/recordings/hls;
            hls_fragment 2s;
            hls_playlist_length 600;
            hls_continuous on;
            hls_cleanup off;
            hls_nested on;
        }
    }
}
